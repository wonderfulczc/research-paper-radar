name: research-paper-radar

on:
  workflow_dispatch:
    inputs:
      show_seen:
        description: "Show papers already present in the seen index"
        required: false
        default: "0"
      query_limit:
        description: "Limit OpenAlex query count for quick tests; 0 means all"
        required: false
        default: "0"
      send_email:
        description: "Email report: 0 skip, 1 require sender SMTP, auto send if fully configured"
        required: false
        default: "0"
      lookback_days:
        description: "Override search lookback in days; 0 uses repository setting/default three years"
        required: false
        default: "0"
      max_recommendations:
        description: "Maximum papers included in the report/email; 0 uses repository setting/default 10"
        required: false
        default: "0"
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: write

concurrency:
  group: research-paper-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      RADAR_ARTIFACT_DIR: artifacts/research_paper_radar
      RADAR_SHOW_SEEN: ${{ github.event.inputs.show_seen || '0' }}
      RADAR_QUERY_LIMIT: ${{ github.event.inputs.query_limit || '0' }}
      RADAR_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days != '0' && github.event.inputs.lookback_days || vars.RADAR_LOOKBACK_DAYS || '0' }}
      RADAR_MAX_RECOMMENDATIONS: ${{ github.event.inputs.max_recommendations != '0' && github.event.inputs.max_recommendations || vars.RADAR_MAX_RECOMMENDATIONS || '10' }}
      RADAR_SCHEDULE_ENABLED: ${{ vars.RADAR_SCHEDULE_ENABLED || '1' }}
      RADAR_INTERVAL_DAYS: ${{ vars.RADAR_INTERVAL_DAYS || '60' }}
      RADAR_KEEPALIVE_DAYS: ${{ vars.RADAR_KEEPALIVE_DAYS || '45' }}
      RADAR_SCHEDULE_INITIAL_LAST_RUN: ${{ vars.RADAR_SCHEDULE_INITIAL_LAST_RUN || '2026-09-01' }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      SPRINGER_NATURE_API_KEY: ${{ secrets.SPRINGER_NATURE_API_KEY }}
      ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
      ELSEVIER_INSTTOKEN: ${{ secrets.ELSEVIER_INSTTOKEN }}
      SEMANTIC_SCHOLAR_ENRICH_LIMIT: "30"
      CROSSREF_ENRICH_LIMIT: "60"
      SPRINGER_NATURE_ENRICH_LIMIT: "20"
      ELSEVIER_ENRICH_LIMIT: "20"
      OPENALEX_TIMEOUT_SECONDS: "15"
      OPENALEX_RETRIES: "1"
      OPENALEX_MAX_TIMEOUTS: "4"
      CAS_PARTITION_MODE: "off"
      RADAR_EMAIL_ENABLED: ${{ github.event_name == 'schedule' && (secrets.RADAR_EMAIL_ENABLED || vars.RADAR_EMAIL_ENABLED || 'auto') || (github.event.inputs.send_email || '0') }}
      RADAR_EMAIL_TO: ${{ secrets.RADAR_EMAIL_TO || vars.RADAR_EMAIL_TO }}
      RADAR_EMAIL_CC: ${{ secrets.RADAR_EMAIL_CC || vars.RADAR_EMAIL_CC }}
      RADAR_EMAIL_BCC: ${{ secrets.RADAR_EMAIL_BCC || vars.RADAR_EMAIL_BCC }}
      RADAR_EMAIL_FROM: ${{ secrets.RADAR_EMAIL_FROM || vars.RADAR_EMAIL_FROM }}
      RADAR_EMAIL_SUBJECT_PREFIX: ${{ secrets.RADAR_EMAIL_SUBJECT_PREFIX || vars.RADAR_EMAIL_SUBJECT_PREFIX || 'Research Paper Radar' }}
      RADAR_EMAIL_ATTACH_JSON: ${{ secrets.RADAR_EMAIL_ATTACH_JSON || vars.RADAR_EMAIL_ATTACH_JSON || '1' }}
      SMTP_PROVIDER: ${{ secrets.SMTP_PROVIDER || vars.SMTP_PROVIDER }}
      SMTP_HOST: ${{ secrets.SMTP_HOST || vars.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || vars.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME || vars.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS || vars.SMTP_USE_TLS }}
      SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL || vars.SMTP_USE_SSL }}
      RADAR_FEEDBACK_ENDPOINT: ${{ secrets.RADAR_FEEDBACK_ENDPOINT || vars.RADAR_FEEDBACK_ENDPOINT }}
      RADAR_FEEDBACK_WRITE_TOKEN: ${{ secrets.RADAR_FEEDBACK_WRITE_TOKEN }}
      RADAR_FEEDBACK_SOURCE_URL: ${{ secrets.RADAR_FEEDBACK_SOURCE_URL || vars.RADAR_FEEDBACK_SOURCE_URL }}
      RADAR_FEEDBACK_READ_TOKEN: ${{ secrets.RADAR_FEEDBACK_READ_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Restore radar memory
        id: radar-state-restore
        uses: actions/cache/restore@v6
        with:
          path: artifacts/research_paper_radar/state
          key: radar-state-${{ github.run_id }}
          restore-keys: |
            radar-state-

      - name: Check configurable schedule
        id: schedule-gate
        run: python work/schedule_gate.py check

      - name: Compile scripts
        if: steps.schedule-gate.outputs.should_run == 'true'
        run: python -m py_compile work/*.py

      - name: Import persistent feedback
        if: steps.schedule-gate.outputs.should_run == 'true'
        continue-on-error: true
        run: python work/sync_feedback.py

      - name: Run literature radar
        id: radar
        if: steps.schedule-gate.outputs.should_run == 'true'
        run: python work/three_year_top_scout.py

      - name: Mark successful scheduled run
        if: steps.radar.outcome == 'success'
        run: python work/schedule_gate.py mark

      - name: Upload radar artifacts
        if: steps.radar.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: research-paper-radar-${{ github.run_id }}
          path: artifacts/research_paper_radar
          if-no-files-found: error

      - name: Send email report
        if: steps.radar.outcome == 'success'
        run: python work/send_radar_email.py

      - name: Save radar memory
        if: always() && steps.radar.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: artifacts/research_paper_radar/state
          key: radar-state-${{ github.run_id }}

      - name: Keep public-repository schedule active
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        run: python work/keepalive.py
